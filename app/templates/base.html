<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras y Presupuestos</title>
    <!-- Tailwind CSS CDN para estilos rápidos y modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Barra de Navegación -->
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-wide">🏗️ Control de Obras</a>
            <div class="space-x-4">
                <a href="/" class="hover:underline">Obras</a>
                <a href="#" class="hover:underline">Materiales</a>
                <a href="{{ url_for('inventario.index') }}" class="hover:underline font-semibold bg-blue-700 px-3 py-1.5 rounded transition">📦 Inventario</a>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-6 py-8 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-sm text-gray-500">
        Gestión de Presupuestos y Obras &copy; 2026
    </footer>

</body>
</html>
