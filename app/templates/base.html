<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras y Presupuestos</title>
    <!-- Tailwind CSS CDN para estilos rápidos y modernos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Barra de Navegación -->
    <nav class="bg-slate-900 border-b border-slate-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            
            <!-- LOGO CIESER -->
            <div class="flex items-center gap-3">
                <a href="{{ url_for('obras.index') }}" class="flex items-center gap-2">
                    <!-- Asegúrate de guardar la imagen del logo en static/img/logo.png -->
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="CIESER Logo" class="h-9 w-auto bg-white p-1 rounded-lg">
                    <span class="font-black text-lg tracking-wider text-white">CONTROL <span class="text-orange-500">OBRAS</span></span>
                </a>
            </div>

            <!-- NAVEGACIÓN -->
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="{{ url_for('obras.index') }}" class="text-orange-400 hover:text-orange-300 font-bold transition">Obras</a>
                <a href="{{ url_for('inventario.index') }}" class="text-slate-300 hover:text-white transition font-medium">
    Inventario
</a>
            </div>

        </div>
    </div>
</nav>

    <!-- Contenido Principal -->
    <main class="container mx-auto px-6 py-8 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-sm text-gray-500">
        Gestión de Presupuestos y Obras &copy; 2026
    </footer>

</body>
</html>
