{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Agregar Material</h1>
        <p class="text-gray-600">Obra: {{ obra.nombre }}</p>
    </div>
    
    <form action="{{ url_for('obras.agregar_material', id=obra.id) }}" method="POST" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Código</label>
                <input type="text" name="codigo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Etapa</label>
                <input type="text" name="etapa" placeholder="Ej: 1, 2, 3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Artículo / Descripción *</label>
            <input type="text" name="articulo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Marca</label>
            <input type="text" name="marca" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Cantidad *</label>
                <input type="number" step="0.01" name="cantidad" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Unidad de Medida *</label>
                <select name="unidad_medida" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    <option value="unidades">Unidades</option>
                    <option value="var">Varillas (var)</option>
                    <option value="kg">Kilos (kg)</option>
                    <option value="bolsas">Bolsas</option>
                    <option value="m3">Metros Cúbicos (m3)</option>
                    <option value="m2">Metros Cuadrados (m2)</option>
                    <option value="litros">Litros</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end space-x-4 pt-4">
            <a href="{{ url_for('obras.detalle', id=obra.id) }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition">Cancelar</a>
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">Guardar Material</button>
        </div>
    </form>
</div>
{% endblock %}
