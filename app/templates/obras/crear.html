{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
    
    <!-- ENCABEZADO CON ÍCONO -->
    <div class="mb-6 flex items-center gap-3">
        <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Registrar Nueva Obra</h1>
    </div>
    
    <form action="{{ url_for('obras.crear') }}" method="POST" class="space-y-5">
        <!-- CAMPO NOMBRE -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre de la Obra <span class="text-red-500">*</span></label>
            <input type="text" name="nombre" required placeholder="Ej: Ampliación Casa Central" 
                   class="w-full rounded-lg border-gray-300 shadow-sm border px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <!-- CAMPO DESCRIPCIÓN -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
            <textarea name="descripcion" rows="3" placeholder="Detalles generales de la obra..." 
                      class="w-full rounded-lg border-gray-300 shadow-sm border px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
        </div>

        <!-- CAMPO PRESUPUESTO -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Presupuesto Inicial - <span class="text-gray-400 font-normal">Opcional</span></label>
            <div class="relative">
                <!-- Símbolo de peso fijo a la izquierda -->
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="text-gray-500 font-medium">$</span>
                </div>
                <input type="number" step="0.01" min="0" name="presupuesto_inicial" placeholder="0.00" 
                       class="w-full rounded-lg border-gray-300 shadow-sm border pl-8 pr-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="flex justify-end space-x-3 pt-6 mt-2 border-t border-gray-100">
            <a href="{{ url_for('obras.index') }}" class="bg-white border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-50 font-medium transition-colors">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 font-medium shadow-sm transition-colors flex items-center gap-2">
                <span>Guardar Obra</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </button>
        </div>
    </form>
</div>
{% endblock %}
