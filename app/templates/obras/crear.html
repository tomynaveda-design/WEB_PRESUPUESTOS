{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Registrar Nueva Obra</h1>
    
    <form action="{{ url_for('obras.crear') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Nombre de la Obra</label>
            <input type="text" name="nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Descripción</label>
            <textarea name="descripcion" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Presupuesto Inicial ($) - Opcional</label>
            <input type="number" step="0.01" name="presupuesto_inicial" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div class="flex justify-end space-x-4 pt-4">
            <a href="{{ url_for('obras.index') }}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Guardar Obra</button>
        </div>
    </form>
</div>
{% endblock %}
